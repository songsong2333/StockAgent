# ============================================================
# A股量化交易系统 全局配置
# ============================================================

# ---------------- 数据路径 ----------------
paths:
  raw_dir: data/raw            # akshare 原始数据(parquet)
  qlib_dir: data/qlib_data     # qlib bin 格式数据
  cache_dir: data/cache        # 财务/ST/持仓/日志等缓存
  log_dir: data/cache/logs
  etf_dir: data/etf            # ETF parquet(独立于个股 raw_dir, 不走qlib)
  hk_dir: data/hk              # 港股日线 parquet(周期探索平台用, 走新浪 stock_hk_daily)
  store_dir: data/store        # 统一序列存储: 替代数据(宏观/能源/商品/气候)月频 parquet
  index_min_dir: data/index_min # 指数60min K线(进出场系统用, 新浪 stock_zh_a_minute)

# ---------------- 数据采集 ----------------
collector:
  adjust: qfq                  # 复权方式: qfq前复权 / hfq后复权 / ""不复权
  start_date: "2018-01-01"     # 历史数据起始日期
  request_sleep: 0.8           # 每次请求间隔(秒), 避免被限
  max_retries: 3               # 单股票失败重试次数
  # 股票池过滤
  exclude_st: true             # 剔除 ST/*ST
  exclude_new_days: 252        # 剔除上市不足 N 个交易日的新股(约1年)
  exclude_kcb: false           # 是否剔除科创板
  exclude_cyb: false           # 是否剔除创业板
  exclude_bj: true             # 剔除北交所(流动性差)

# ---------------- qlib 数据集 ----------------
qlib:
  provider_uri: data/qlib_data
  region: cn                   # cn / us

# ---------------- 股票池 ----------------
universe: config/watchlist.yaml   # 选股范围: watchlist文件路径 或 "all"(全市场)

# ---------------- 轮动策略 ----------------
rotation:
  universe: config/sector_leaders.yaml   # 轮动候选池(板块龙头)
  topn: 5                       # 持仓数(板块数)
  max_per_sector: 1             # 每板块最多选几只(1=纯板块轮动)
  max_dd_target: 0.15           # 目标最大回撤(用户可调): 系统按此自动定仓位比例
  freq: 5                       # 调仓频率(交易日)
  mom_win: 60                   # 动量窗口
  bias_max: 0.20                # 乖离过滤上限(越低越不追高)

# ---------------- ETF 策略 ----------------
# 成本(佣金/最低5元/整手/T+1/成交价)复用下方 backtest 段; ETF 免印花税, 回测时跳过 stamp_duty。
etf:
  pool_file: config/etf_pool.yaml   # 分层标的池(broad/sector + benchmark_etf)
  benchmark_etf: "510300"           # 大盘择时基准标的(沪深300ETF)
  backtest_start: "2019-01-01"      # 回测起始日(早于此无数据)
  initial_capital: 1000000          # 初始资金(影响最低佣金门槛是否触发)
  trend:                            # 趋势择时(宽基+避险池)
    ma_short: 20
    ma_long: 60
    confirm_days: 2                 # 防抖: 信号需连续确认N日
    band_filter: 0.005              # 防抖: 均线带宽过滤(0.5%, 震荡市不打脸)
    rebalance_freq: 5               # 调仓频率(交易日): 5=周 20=月
  rotation:                         # 动量轮动
    broad_topn: 3                   # 宽基池持仓数
    sector_topn: 3                  # 行业池持仓数
    mom_short: 20                   # 短线动量窗口(行业池用)
    mom_long: 60                    # 中长期动量窗口
    sector_market_timing: true      # 行业池叠大盘择时开关(空头空仓避险)
    bench_ma: 60                    # 大盘MA窗口
    rebalance_freq: 5
  rotation_flow:                     # 方向①: 资金流+题材热度行业轮动权重(东财限流时自动转纯动量)
    w_mom: 0.4
    w_flow: 0.3
    w_heat: 0.3
  multifactor:                       # 方向②: 多因子综合评分权重(broad池无sector→w_flow转w_mom)
    w_trend: 0.25
    w_mom: 0.25
    w_flow: 0.20
    w_rs: 0.15                       # 相对强度(vs基准60日超额)
    w_vol: 0.15                      # 波动率反向(低波优先)
    topn: 5
  sentiment:                         # 方向③: 市场情绪择时(叠加在均线择时之上)
    enabled: true
    hot_temp: 75                     # 过热温度阈值
    hot_zha: 0.4                     # 过热炸板率阈值(同时满足才过热)
    panic_temp: 25                   # 恐慌温度阈值
    panic_dt: 100                    # 恐慌跌停数阈值

# ---------------- 确定性进出场系统 (成长进攻 ↔ 红利防守, 60min 扳机 + 日线 conviction) ----------------
# 进场=多条件共振(AND, 全满足才进, 确定性优先/低频); 离场=任一拐点预兆(OR, 敏感保命)。
# 确定性分级 A/B/C(满足条件计数), 仅 A 级建议进场。进攻离场 -> 轮动到红利100 防守。
entry_exit:
  growth:                        # 进攻标的(指数源做信号, etf 为可交易标的)
    # 中证500 已剔除: 实测偏震荡/均值回归, 趋势跟踪在其上 whipsaw 亏损(7年-33%)
    - {index: "sz399006", etf: "159915", name: "创业板"}
    - {index: "sh000688", etf: "588870", name: "科创50"}
  defense: {etf: "515180", name: "红利100"}   # 防守仓位, 成长离场时切入
  market: "sh000300"             # 大盘环境闸门(沪深300)
  # 日线 conviction(确定性根基)
  daily_ma_short: 20
  daily_ma_long: 60
  # 60min 扳机
  ma_short: 20                   # 60min 短期均线(≈1周)
  ma_long: 60                    # 60min 长期均线(≈3周)
  breakout_lookback: 20          # 强度: 突破近N根60min高点(≈1周新高)
  vol_mult: 1.5                  # 量能: 量 > vol_mult × 均量20
  rsi_period: 14
  rsi_lo: 50                     # 动量健康区间下限(强)
  rsi_hi: 82                     # 上限放宽: 突破时RSI天然偏高(实测中位~71), 过热交给离场衰竭判断
  atr_period: 14
  atr_stop_mult: 2.0             # 初始止损 = 入场价 - ATR×mult
  cooldown_bars: 8               # 离场后冷却N根60min再考虑进场(防打脸)
  overextend_mult: 0.06          # 衰竭: 收盘偏离MA60超此比例(6%)且放量长上影 -> 离场
  # v2 趋势跟踪(抗whipsaw, 2年回测18/18参数组合期望>0): Donchian突破 + ER趋势质量过滤 + ATR移动止损
  donchian: 20                   # 突破回看窗口(20≈一周)
  er_n: 30                       # Kaufman效率比窗口
  er_min: 0.35                   # 趋势质量门槛: 越高越只做清晰趋势(抗震荡whipsaw); 实测0.35+宽止损最优
  atr_trail_mult: 4.0            # 移动止损=持仓期最高收盘 - 4×ATR。宽止损让利润奔跑(实测优于2/3)
  vol_mult_entry: 1.2            # 进场放量确认(主力进场代理): 突破bar量>1.2×均量20。实测普遍提升胜率,
                                 #   尤其科创50日线由-9.3%转正+14%; 代价是更低频。设 null 可关闭。

# ---------------- 周期探索平台 (中期季节性/相关性/regime/驱动归因) ----------------
# 与日线 ETF 策略互补: 服务周级/月级行情判断。一切皆"序列"(ETF/行业指数/港股/商品/宏观/气候),
# 统一进 data/store + data/etf + data/hk, 由 collector.store.universe_panel 对齐成面板。
# 统计诚实优先: 长历史(行业指数10-17年/宏观数十年)做主体; 小样本标灰; 多重检验走 BH-FDR。
cycle:
  freq: "M"                    # 默认分析频率: M月 / W周(季节性/regime用月, lead-lag可切周)
  universe_categories: ["broad", "sector", "seasonal", "hk", "macro", "energy", "commodity", "climate"]
  min_n: 5                     # 最小样本量: 低于此值的统计结果标灰, 不参与"最强"排序
  fdr_alpha: 0.05              # BH-FDR 多重检验显著性水平(全宇宙两两扫描≈数千对, 必须校正)
  max_lag: 8                   # lead-lag 最大滞后(周)
  bootstrap_iters: 1000        # 置信区间 bootstrap 次数
  ci: 0.95                     # 置信水平
  window:                      # 事件窗口检测(替代固定日历月分桶, 捕捉"窗口漂移")
    method: "peak"             # peak(主升浪峰谷区间) / runlength(最长连阳) / zscore
    cross_validate: true       # 跑两种方法, 起止不一致的年份标注
  regime:                      # regime 标注(条件分布: 如厄尔尼诺年电力窗口是否更长/更晚)
    enso_threshold: 0.5        # ONI >= +0.5 连续5月 = 厄尔尼诺; <= -0.5 = 拉尼娜
    market_ma: 12              # 月线牛熊regime的MA窗口(月)
    liquidity_lookback: 12     # 流动性宽紧判定的回看窗口(月)

# ---------------- 经济研究 Agent (GLM 大脑 + 工具调用 + 规律知识库) ----------------
# agent 的 tools = strategy/{seasonality,discovery,regime}.py(已建好)。本块配置 LLM 客户端。
# 统计诚实: 规律入库默认 tentative, 升 confirmed 需过门槛或人工; 相关非因果。
agent:
  api_key_env: ZHIPUAI_API_KEY     # 智谱 API key 的环境变量名(仿 license.secret_env); 无 key 时优雅降级
  base_url: ""                     # 留空用 zhipuai 默认; 或填 open.bigmodel.cn 兼容端点
  model_monitor: glm-4.5-air       # 监控摘要用(便宜, ¥0.8/¥2 每百万 token)
  model_chat: glm-4.6              # 对话用(agent 调优, 200K 上下文)
  max_rounds: 8                    # tool-calling 循环上限(防失控)
  enable_monitor: true
  knowledge_dir: data/knowledge    # 规律库 + 监控快照目录
  monitor_cadence: weekly          # 周频(中期研究, 日频太吵)

# ---------------- 因子与模型 ----------------
model:
  handler: alpha158            # 因子集: alpha158 (qlib内置158因子)
  model_class: lgbm            # 模型: lgbm / linear
  label: "Ref($close, -2) / Ref($close, -1) - 1"  # 预测目标: 次日收益
  # 训练区间: 用2025年数据训练, 预测2026年
  train_start: "2025-01-01"
  train_end: "2025-09-30"
  valid_start: "2025-10-01"
  valid_end: "2025-12-31"
  test_start: "2026-01-01"
  test_end: "2026-06-19"

# ---------------- 回测 ----------------
backtest:
  topk: 5                      # 持仓股票数 (股票池仅17只, 取头部5只)
  n_drop: 1                    # 每次调仓最多替换数(TopkDropout)
  benchmark: "SH000300"        # 基准指数(需采集, 见 index_collector)
  # A股交易成本
  commission_rate: 0.00025     # 佣金(双边万2.5)
  min_commission: 5.0          # 单笔最低佣金(元)
  stamp_duty: 0.001            # 印花税(卖出千1)
  transfer_fee: 0.00002        # 过户费(双边万分之0.2)
  slippage: 0.001              # 滑点
  # 时机
  trade_unit: 100              # 一手=100股
  deal_price: open             # 成交价: open / close / vwap
  t_plus_1: true               # T+1

# ---------------- 信号与调仓 ----------------
live:
  topk: 5                      # 目标持仓数
  weight_scheme: equal         # 权重: equal等权 / score按打分加权
  rebalance_freq: weekly       # 调仓频率: daily / weekly
  holdings_file: data/cache/current_holdings.yaml  # 当前持仓(人工维护)
  signal_file: data/cache/latest_signal.md         # 最新信号输出
  dry_run: true                # true=只生成不推送

# ---------------- 通知 ----------------
notify:
  enable: false
  # 企业微信/钉钉 webhook (二选一)
  webhook_url: ""              # https://qyapi.weixin.qq.com/...
  webhook_type: wechat         # wechat / dingtalk
  # 邮件 (SMTP)
  email_enable: false
  smtp_host: "smtp.qq.com"
  smtp_port: 465
  smtp_user: ""
  smtp_pass: ""
  email_to: ""                 # 收件人, 逗号分隔

# ---------------- 调度 ----------------
schedule:
  daily_run_time: "16:30"      # 盘后执行时间
  timezone: "Asia/Shanghai"

# ---------------- 许可证 / 付费门控 ----------------
license:
  secret_env: STOCK_AGENT_SECRET   # 激活码签名密钥的环境变量名(生产务必设置)
  # 免费功能: 情绪温度计/打板梯队/强势股/题材热度/龙虎榜/轮动/回测
  # Pro 付费: 盘中盯盘预警 / 自研ML模型训练
